services:
  web:
    build: ./src
    ports:
      - "8000:8000"
    command: gunicorn src.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles
    depends_on:
      - web


volumes:
  static_data:
  media_data: