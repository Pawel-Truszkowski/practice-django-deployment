services:
  web:
    build: ./src
    command: python manage.py runserver
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy  # czeka aż baza będzie gotowa

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 5

volumes:
  postgres_data: